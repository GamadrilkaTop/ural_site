{% macro catalog_sidebar(active_page) %}
<div class="sidebar">
  <nav class="sidebar-menu">
    <h3><i class="fa fa-list" style="margin-right:8px;"></i>Каталог</h3>
    <a href="{{ url_for('catalog_pullers') }}" {% if active_page=='pullers' %}class="active"{% endif %}>
      Съёмники <i class="fa fa-chevron-right"></i>
    </a>
    <a href="{{ url_for('catalog_couplings') }}" {% if active_page=='couplings' %}class="active"{% endif %}>
      Муфты <i class="fa fa-chevron-right"></i>
    </a>
    <a href="{{ url_for('catalog_railway') }}" {% if active_page=='railway' %}class="active"{% endif %}>
      ЖД Запчасти <i class="fa fa-chevron-right"></i>
    </a>
  </nav>
  <div style="background: var(--light-gray); border: 1px solid var(--border); padding: 18px; margin-top: 16px;">
    <p style="font-size:0.85rem; color: var(--gray); margin-bottom: 12px;"><strong style="color: var(--dark);">Заказ и консультация:</strong></p>
    <a href="tel:+73435352727" style="display:flex;align-items:center;gap:8px;font-family:var(--font-heading);font-size:0.92rem;font-weight:600;color:var(--dark);margin-bottom:8px;">
      <i class="fa fa-phone" style="color:var(--green);"></i>+7 (3435) 35-27-27
    </a>
    <a href="mailto:info@ppural.ru" style="display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--gray);">
      <i class="fa fa-envelope" style="color:var(--green);"></i>info@ppural.ru
    </a>
  </div>
</div>
{% endmacro %}
