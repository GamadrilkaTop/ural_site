{% extends "admin/base.html" %}
{% block body %}
<div class="top">
  <h1>Новости</h1>
  <a class="btn" href="{{ url_for('admin_news_add') }}">Добавить новость</a>
</div>
<table>
  <tr><th>Дата</th><th>Заголовок</th><th>Статус</th><th>Действия</th></tr>
  {% for item in items %}
  <tr>
    <td>{{ item.published_at }}</td>
    <td>{{ item.title }}</td>
    <td>{{ 'Опубликовано' if item.is_published else 'Скрыто' }}</td>
    <td>
      <div class="actions">
        <a class="btn small gray" href="{{ url_for('admin_news_edit', item_id=item.id) }}">Редактировать</a>
        <form method="post" action="{{ url_for('admin_news_delete', item_id=item.id) }}" onsubmit="return confirm('Удалить новость?')">
          <button class="btn small red" type="submit">Удалить</button>
        </form>
      </div>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
