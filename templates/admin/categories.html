{% extends "admin/base.html" %}
{% block body %}
<div class="top">
  <h1>Категории</h1>
  <a class="btn" href="{{ url_for('admin_category_add') }}">Добавить категорию</a>
</div>
<table>
  <tr><th>Название</th><th>Описание</th><th>Порядок</th><th>Действия</th></tr>
  {% for item in items %}
  <tr>
    <td>{{ item.name }}</td>
    <td>{{ item.description }}</td>
    <td>{{ item.sort_order }}</td>
    <td>
      <div class="actions">
        <a class="btn small gray" href="{{ url_for('admin_category_edit', item_id=item.id) }}">Редактировать</a>
        <form method="post" action="{{ url_for('admin_category_delete', item_id=item.id) }}" onsubmit="return confirm('Удалить категорию?')">
          <button class="btn small red" type="submit">Удалить</button>
        </form>
      </div>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
