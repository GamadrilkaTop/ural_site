{% extends "admin/base.html" %}
{% block page_title %}{{ 'Добавить категорию' if action == 'create' else 'Редактировать категорию' }}{% endblock %}
{% block content %}
<div class="card">
  <form method="post">
    <div class="field"><label>Название</label><input type="text" name="name" value="{{ item.name if item else '' }}" required></div>
    <div class="field"><label>Описание</label><textarea name="description">{{ item.description if item else '' }}</textarea></div>
    <div class="field"><label>Порядок сортировки</label><input type="number" name="sort_order" value="{{ item.sort_order if item else 0 }}"></div>
    <div class="field"><label><input type="checkbox" name="is_active" {% if not item or item.is_active %}checked{% endif %}> Показывать на сайте</label></div>
    <div class="actions"><button class="btn" type="submit">Сохранить</button><a class="btn-outline" href="{{ url_for('admin_categories_list') }}">Назад</a></div>
  </form>
</div>
{% endblock %}
