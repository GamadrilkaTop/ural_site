{% extends "admin/base.html" %}
{% block body %}
<h1>{{ 'Редактировать новость' if item else 'Добавить новость' }}</h1>
<div class="card">
  <form method="post">
    <label>Заголовок</label>
    <input name="title" value="{{ item.title if item else '' }}" required>
    <label>Дата публикации</label>
    <input type="date" name="published_at" value="{{ item.published_at if item else '' }}">
    <label>Текст новости</label>
    <textarea name="content" required>{{ item.content if item else '' }}</textarea>
    <label><input type="checkbox" name="is_published" style="width:auto;" {% if not item or item.is_published %}checked{% endif %}> Опубликовано</label>
    <button class="btn" type="submit">Сохранить</button>
    <a class="btn gray" href="{{ url_for('admin_news') }}">Назад</a>
  </form>
</div>
{% endblock %}
