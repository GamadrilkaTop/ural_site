{% extends "admin/base.html" %}
{% block body %}
<div class="login-box">
  <h1 style="font-family:'Oswald',sans-serif;margin-top:0;">Вход в админ-панель</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <form method="post">
    <div class="field"><label>Логин</label><input type="text" name="username" required></div>
    <div class="field"><label>Пароль</label><input type="password" name="password" required></div>
    <button class="btn" type="submit"><i class="fa fa-right-to-bracket"></i> Войти</button>
  </form>
</div>
{% endblock %}
