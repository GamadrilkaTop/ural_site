{% extends "admin/base.html" %}
{% block login %}
<div class="login-box">
  <h1 style="margin-top:0;">Вход в админ-панель</h1>
  <p class="muted">Доступ только для администратора</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <form method="post">
    <label>Логин</label>
    <input type="text" name="username" required>
    <label>Пароль</label>
    <input type="password" name="password" required>
    <button class="btn" type="submit" style="margin-top:18px;"><i class="fa fa-right-to-bracket"></i> Войти</button>
  </form>
</div>
{% endblock %}
