{% extends "admin/base.html" %}
{% block page_title %}{{ 'Добавить товар' if action == 'create' else 'Редактировать товар' }}{% endblock %}
{% block content %}
<div class="card">
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="current_image" value="{{ item.image if item and item.image else '' }}">
    <div class="grid-2">
      <div class="field"><label>Название</label><input type="text" name="name" value="{{ item.name if item else '' }}" required></div>
      <div class="field"><label>Категория</label>
        <select name="category_id" required>
          <option value="">Выберите категорию</option>
          {% for category in categories %}
          <option value="{{ category.id }}" {% if item and item.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Артикул</label><input type="text" name="sku" value="{{ item.sku if item else '' }}"></div>
      <div class="field"><label>Статус наличия</label><input type="text" name="stock_status" value="{{ item.stock_status if item else 'В наличии' }}"></div>
    </div>
    <div class="field"><label>Краткое описание</label><textarea name="short_description">{{ item.short_description if item else '' }}</textarea></div>
    <div class="field"><label>Полное описание</label><textarea name="description">{{ item.description if item else '' }}</textarea></div>
    <div class="grid-2">
      <div class="field"><label>Изображение</label><input type="file" name="image"></div>
      <div class="field"><label>Порядок сортировки</label><input type="number" name="sort_order" value="{{ item.sort_order if item else 0 }}"></div>
    </div>
    <div class="field"><label>Характеристики</label><textarea name="specs_text" style="min-height:180px;" placeholder="Материал: Сталь 45&#10;Масса: 2,8 кг&#10;Применение: Пасс. вагоны РЖД">{{ specs_text }}</textarea><div class="muted">Каждая строка в формате: Параметр: Значение</div></div>
    <div class="field"><label><input type="checkbox" name="is_published" {% if not item or item.is_published %}checked{% endif %}> Показывать на сайте</label></div>
    <div class="actions"><button class="btn" type="submit">Сохранить</button><a class="btn-outline" href="{{ url_for('admin_products_list') }}">Назад</a></div>
  </form>
</div>
{% endblock %}
