{% macro info_sidebar(active_page) %}
<div class="sidebar">
  <nav class="sidebar-menu">
    <h3><i class="fa fa-info-circle" style="margin-right:8px;"></i>Информация</h3>
    <a href="{{ url_for('info_news') }}" {% if active_page=='news' %}class="active"{% endif %}>
      Новости <i class="fa fa-chevron-right"></i>
    </a>
    <a href="{{ url_for('info_articles') }}" {% if active_page=='articles' %}class="active"{% endif %}>
      Статьи <i class="fa fa-chevron-right"></i>
    </a>
    <a href="{{ url_for('info_faq') }}" {% if active_page=='faq' %}class="active"{% endif %}>
      Вопрос–ответ <i class="fa fa-chevron-right"></i>
    </a>
    <a href="{{ url_for('info_agreement') }}" {% if active_page=='agreement' %}class="active"{% endif %}>
      Пользовательское соглашение <i class="fa fa-chevron-right"></i>
    </a>
  </nav>
</div>
{% endmacro %}
